[package]
name = "mdcopy"
version = "0.4.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.5.54", features = ["derive"] }
clipboard-rs = "0.3.1"
dirs = "6.0.0"
env_logger = "0.11.8"
log = "0.4.29"
markdown = "1.0.0"
mermaid-rs-renderer = { git = "https://github.com/zed-industries/mermaid-rs-renderer", branch = "fix-font-family-xml-escaping", default-features = false }
resvg = "0.45"
rimage = "0.12"
serde = { version = "1.0.228", features = ["derive"] }
syntect = "5.3.0"
tempfile = "3.24.0"
toml = "0.9.11"
ureq = "3.1.4"
zune-core = "0.5"
zune-image = "=0.5.0-rc0"

# MCP server (optional, behind "mcp" feature)
rmcp = { version = "0.16", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "elicitation", "schemars"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"], optional = true }
schemars = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
axum = { version = "0.8", optional = true }
tokio-util = { version = "0.7", optional = true }

[features]
mcp = ["dep:rmcp", "dep:tokio", "dep:schemars", "dep:serde_json", "dep:axum", "dep:tokio-util"]

# macOS-specific dependencies for native clipboard
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSAttributedString", "NSData", "NSString", "NSArray", "NSURL", "NSRange"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSTextAttachment", "NSImage", "NSFont", "NSFontDescriptor", "NSColor", "NSAttributedString", "NSTextTable", "NSParagraphStyle"] }
